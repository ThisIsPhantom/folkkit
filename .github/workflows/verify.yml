name: Verify

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - name: Check out full source history
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.3

      - name: Install the locked dependency graph
        run: bun install --frozen-lockfile --ignore-scripts

      - name: Lint
        run: bun run lint

      - name: Run unit and contract tests
        run: bun run test:run

      - name: Verify committed third-party notices
        run: bun run check:notices

      - name: Build the static hosting tree and enforce budgets
        run: bun run build:site

      - name: Verify same-origin runtime artifacts
        run: bun run test:runtime-artifacts

      - name: Test the hosting allowlist and publishing gates
        shell: powershell
        run: powershell.exe -NoProfile -ExecutionPolicy Bypass -File scripts/tests/PleskTree.Tests.ps1

      - name: Validate the built hosting tree
        shell: powershell
        run: powershell.exe -NoProfile -ExecutionPolicy Bypass -File scripts/Test-PleskTree.ps1 -SourcePath dist

      - name: Install Chromium for browser tests
        run: bun run test:e2e:install

      - name: Run browser tests
        run: bun run test:e2e
