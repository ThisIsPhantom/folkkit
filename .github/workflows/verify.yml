name: Verify

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - name: Check out full source history
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Set up Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: 1.3.3

      - name: Install the locked dependency graph
        run: bun install --frozen-lockfile --ignore-scripts

      - name: Lint
        run: bun run lint

      - name: Run unit and contract tests
        run: bun run test:run

      - name: Verify immutable workflow actions and credential boundaries
        run: node scripts/validate-workflow-security.mjs

      - name: Verify committed third-party notices
        run: bun run check:notices

      - name: Build the static hosting tree and enforce budgets
        run: bun run build:site

      - name: Verify same-origin runtime artifacts
        run: bun run test:runtime-artifacts

      - name: Test the hosting allowlist and publishing gates
        shell: powershell
        run: powershell.exe -NoProfile -ExecutionPolicy Bypass -File scripts/tests/PleskTree.Tests.ps1

      - name: Validate the built hosting tree
        shell: powershell
        run: powershell.exe -NoProfile -ExecutionPolicy Bypass -File scripts/Test-PleskTree.ps1 -SourcePath dist

      - name: Install Chromium, Firefox, and WebKit for the browser matrix
        run: bun run test:e2e:install

      - name: Run browser tests
        run: bun run test:e2e

      - name: Rebuild the exact hosting artifact for CSP verification
        run: bun run build:site

      - name: Run real media conversion under production hosting headers
        env:
          FOLKKIT_E2E_HOSTING_HEADERS: '1'
          FOLKKIT_E2E_PORT: '4182'
        run: node ./node_modules/playwright/cli.js test hosting-csp.spec.js
