name: Publish hosting branch

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: publish-plesk
  cancel-in-progress: false

jobs:
  prepare-hosting:
    if: github.ref == 'refs/heads/main'
    runs-on: windows-latest
    timeout-minutes: 30
    outputs:
      prepared-digest: ${{ steps.prepare.outputs.prepared-digest }}
    steps:
      - name: Check out synchronized main
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: main
          fetch-depth: 0
          persist-credentials: false

      - name: Set up Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: 1.3.3

      - name: Install the locked dependency graph
        run: bun install --frozen-lockfile --ignore-scripts

      - name: Build the operator-gated public artifact without write credentials
        env:
          VITE_PUBLIC_OPERATOR_NAME: ${{ secrets.FOLKKIT_PUBLIC_OPERATOR_NAME }}
          VITE_PUBLIC_CONTACT_EMAIL: ${{ secrets.FOLKKIT_PUBLIC_CONTACT_EMAIL }}
          FOLKKIT_RELEASE_COMMIT: ${{ github.sha }}
        run: bun run build:release

      - name: Validate the hosting allowlist before packaging
        shell: powershell
        run: powershell.exe -NoProfile -ExecutionPolicy Bypass -File scripts/Test-PleskTree.ps1 -SourcePath dist

      - name: Bind the hosting archive, tree and source revision by SHA-256
        id: prepare
        run: node scripts/prepared-plesk-artifact.mjs prepare "${{ runner.temp }}\folkkit-plesk" "${{ github.sha }}"

      - name: Upload the immutable prepared artifact
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: folkkit-hosting-${{ github.sha }}
          path: ${{ runner.temp }}\folkkit-plesk
          if-no-files-found: error
          retention-days: 1

  publish-hosting:
    needs: prepare-hosting
    if: github.ref == 'refs/heads/main'
    permissions:
      contents: write
    runs-on: windows-latest
    timeout-minutes: 10
    steps:
      - name: Check out synchronized main without persisting credentials
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: main
          fetch-depth: 0
          persist-credentials: false

      - name: Download the prepared hosting artifact
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: folkkit-hosting-${{ github.sha }}
          path: ${{ runner.temp }}\folkkit-plesk

      - name: Verify and fast-forward the hosting branch
        env:
          GITHUB_TOKEN: ${{ github.token }}
          FOLKKIT_PREPARED_DIGEST: ${{ needs.prepare-hosting.outputs.prepared-digest }}
        run: node scripts/prepared-plesk-artifact.mjs push "${{ runner.temp }}\folkkit-plesk"

      - name: State the deployment boundary
        run: Write-Output 'The plesk branch was updated. No Hosttech login, upload, DNS change, or live deployment was performed.'
